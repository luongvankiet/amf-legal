<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Connecting Instagram…</title>
<meta name="robots" content="noindex"></head>
<body style="font-family:system-ui;padding:2rem;max-width:40rem;margin:auto">
<p>Completing Instagram connection…</p>
<p id="fallback" style="display:none">If nothing happens, your AI Media Factory app isn't running.
Start it, then <a id="retry" href="#">click here to retry</a>.</p>
<script>
  // Forwards Instagram's OAuth callback (code/state/error in the query string) to the local
  // AI Media Factory API, which performs the token exchange server-side. Meta requires
  // an HTTPS redirect URI on a verified domain, so this static page bridges to localhost.
  // The return port rides in the state suffix ({48-hex}.{port}) because Meta echoes only
  // code+state through the redirect — a custom query param would not survive it. The full
  // state string, suffix included, is forwarded untouched; the API exact-matches it.
  var params = new URLSearchParams(window.location.search);
  var port = 4004;
  var state = params.get('state') || '';
  var dot = state.indexOf('.');
  if (dot > -1) {
    var suffix = state.slice(dot + 1);
    var p = parseInt(suffix, 10);
    if (p >= 1024 && p <= 65535 && String(p) === suffix) port = p;
  }
  var target = 'http://localhost:' + port + '/api/connections/instagram/oauth/callback' + window.location.search;
  document.getElementById('retry').href = target;
  document.getElementById('fallback').style.display = 'block';
  window.location.replace(target);
</script>
</body></html>
